<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="60">
  <title>Daily Calendar</title>
  <style>
    body { margin: 24px; background: white; color: black; font: 22px Arial, sans-serif; }
    .day { margin: 0; font-size: 16px; letter-spacing: 3px; text-transform: uppercase; }
    h1 { margin: 4px 0 20px; font: bold 42px Georgia, serif; }
    table { width: 100%; border-collapse: collapse; border-top: 2px solid black; }
    th, td { padding: 14px 0; border-bottom: 1px solid black; text-align: left; vertical-align: top; }
    th { width: 110px; padding-right: 12px; font-size: 17px; white-space: nowrap; }
  </style>
</head>
<body>
  <p class="day">Wednesday</p>
  <h1>November 25</h1>
  <table aria-label="Daily appointments">
    <tr><th scope="row">9:00 AM</th><td>Appointment</td></tr>
    <tr><th scope="row">2:00 PM</th><td>Pick up supplies</td></tr>
  </table>
</body>
</html>
